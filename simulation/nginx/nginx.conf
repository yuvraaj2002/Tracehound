# Basic auth in front of Loki, Tempo and Prometheus, shaped like Grafana Cloud: each backend
# has its own numeric username (instance ID) and its own token as the password. Each backend
# keeps its usual port, so URLs stay http://localhost:3100 etc.
#
# Test-only credentials (hashes in htpasswd.*):
#   Loki        1180421 / glc_test_loki_7Hq2xR9vLm4Kp
#   Tempo       1180422 / glc_test_tempo_3Wn8bT5yJc6Ds
#   Prometheus  2391005 / glc_test_prom_9Fk4eZ1aVg7Nu

events {}

http {
    auth_basic "Tracehound test observability";

    # Long queries (wide time ranges) can take a while.
    proxy_read_timeout 120s;

    server {
        listen 3100;    # Loki
        auth_basic_user_file /etc/nginx/htpasswd.loki;
        location / { proxy_pass http://lgtm:3100; }
    }

    server {
        listen 3200;    # Tempo
        auth_basic_user_file /etc/nginx/htpasswd.tempo;
        location / { proxy_pass http://lgtm:3200; }
    }

    server {
        listen 9090;    # Prometheus
        auth_basic_user_file /etc/nginx/htpasswd.prometheus;
        location / { proxy_pass http://lgtm:9090; }
    }
}
